name: Web and native portable checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            architecture: x64
            python: .cache/packaging-venv/Scripts/python.exe
          - runner: macos-14
            target: macos-arm64
            architecture: arm64
            python: .cache/packaging-venv/bin/python
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.architecture }}
      - name: Workspace-local build environment
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          root = Path.cwd().resolve()
          scratch = root / 'output/dev/current/runtime'
          scratch.mkdir(parents=True, exist_ok=True)
          values = {'TEMP': scratch, 'TMP': scratch, 'TMPDIR': scratch,
                    'NPM_CONFIG_CACHE': root / '.cache/npm', 'PIP_CACHE_DIR': root / '.cache/pip',
                    'PYINSTALLER_CONFIG_DIR': root / '.cache/pyinstaller', 'XDG_CACHE_HOME': root / '.cache',
                    'GAIAGIS_WORKSPACE_ROOT': root / 'output/dev/current/mac-workspace',
                    'PYTHONDONTWRITEBYTECODE': '1', 'PYTHONUTF8': '1'}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf8') as stream:
              for key, value in values.items():
                  stream.write(f'{key}={value}\n')
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run build:release
        working-directory: web
      - run: npm run audit:release
        working-directory: web
      - run: python -B -m venv .cache/packaging-venv
      - run: ${{ matrix.python }} -B -m pip install --cache-dir .cache/pip -r tools/build/requirements.txt
      - name: Native build and isolated code-only launch
        shell: python {0}
        run: |
          import subprocess, sys
          sys.path.insert(0, 'tools/build')
          from local_package import native_target
          if native_target() != '${{ matrix.target }}':
              raise RuntimeError('Runner architecture mismatch')
          subprocess.run(['${{ matrix.python }}', '-B', 'tools/build/local_package.py', '--skip-web-build'], check=True)
