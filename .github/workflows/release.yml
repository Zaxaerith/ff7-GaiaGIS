name: Release — exact-tag native builds
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (must contain this recipe)
        required: true
        type: string
      dry_run:
        description: Build artifacts only; do not create a GitHub Release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Verify annotated tag, version and exact clean source
        shell: python {0}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          import os, re, subprocess, sys
          sys.path.insert(0, 'src')
          from gaiagis._version import __version__
          tag = os.environ['RELEASE_TAG']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != 'v' + __version__:
              raise RuntimeError('Version/tag mismatch')
          if git('cat-file', '-t', 'refs/tags/' + tag) != 'tag':
              raise RuntimeError('Annotated tag required')
          if git('rev-parse', 'HEAD') != git('rev-parse', 'refs/tags/' + tag + '^{commit}') or git('status', '--porcelain'):
              raise RuntimeError('Exact clean tag checkout required')
      - name: Workspace-local build environment
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          root = Path.cwd().resolve()
          scratch = root / 'output/dev/current/runtime'
          scratch.mkdir(parents=True, exist_ok=True)
          values = {'TEMP': scratch, 'TMP': scratch, 'TMPDIR': scratch,
                    'NPM_CONFIG_CACHE': root / '.cache/npm', 'PIP_CACHE_DIR': root / '.cache/pip',
                    'PYINSTALLER_CONFIG_DIR': root / '.cache/pyinstaller', 'XDG_CACHE_HOME': root / '.cache',
                    'GAIAGIS_WORKSPACE_ROOT': root / 'output/dev/current/build-workspace',
                    'PYTHONDONTWRITEBYTECODE': '1', 'PYTHONUTF8': '1'}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf8') as stream:
              for key, value in values.items():
                  stream.write(f'{key}={value}\n')
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run build:release
        working-directory: web
      - run: npm run audit:release
        working-directory: web
      - run: python -B -m venv .cache/packaging-venv
      - run: .cache/packaging-venv/Scripts/python.exe -B -m pip install --cache-dir .cache/pip -r tools/build/requirements.txt
      - name: Native freeze, deep audit, ZIP, checksum and isolated launch
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: python {0}
        run: |
          import os, subprocess, sys
          sys.path.insert(0, 'tools/build')
          from local_package import native_target
          if native_target() != 'windows-x64':
              raise RuntimeError('Runner architecture mismatch')
          subprocess.run(['.cache/packaging-venv/Scripts/python.exe', '-B', 'tools/build/local_package.py', '--skip-web-build',
                          '--keep-artifacts', '--release-tag', os.environ['RELEASE_TAG'],
                          '--output-dir', 'output/release'], check=True)
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows-x64
          path: |
            output/release/GaiaGIS-v*-windows-x64.zip
            output/release/SHA256SUMS.txt
          if-no-files-found: error
  assemble:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-windows-x64
          path: release-artifacts/release-windows-x64
      - name: Verify Windows package and assemble one checksum manifest
        shell: python {0}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          root = Path('release-artifacts'); tag = os.environ['RELEASE_TAG']
          combined = []; commits = set()
          for target in ('windows-x64',):
              folder = root / ('release-' + target)
              name = f'GaiaGIS-{tag}-{target}.zip'
              lines = (folder / 'SHA256SUMS.txt').read_text(encoding='ascii').splitlines()
              if len(lines) != 1 or lines[0].split() != [hashlib.sha256((folder / name).read_bytes()).hexdigest(), name]:
                  raise RuntimeError('Unexpected package/checksum')
              with zipfile.ZipFile(folder / name) as archive:
                  path = 'GaiaGIS/portable-manifest.json'
                  manifest = json.loads(archive.read(path))
              if manifest.get('artifact_kind') != 'tag-release' or manifest.get('source_ref') != tag or manifest.get('source_dirty') is not False or manifest.get('target') != target or manifest.get('tool_version') != tag[1:]:
                  raise RuntimeError('Build provenance mismatch')
              commits.add(manifest['source_base_commit'])
              (folder / name).rename(root / name)
              combined.append(lines[0])
          if len(commits) != 1:
              raise RuntimeError('Packages built from different commits')
          records = subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/ref/tags/{tag}'], text=True)
          ref = json.loads(records)['object']
          if ref['type'] != 'tag':
              raise RuntimeError('Annotated tag required')
          tagged = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/tags/{ref["sha"]}'], text=True))['object']
          if tagged['type'] != 'commit' or tagged['sha'] not in commits:
              raise RuntimeError('Tag target changed')
          (root / 'SHA256SUMS.txt').write_text('\n'.join(combined) + '\n', encoding='ascii')
      - uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: |
            release-artifacts/GaiaGIS-v*-windows-x64.zip
            release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: assemble
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: release-packages
          path: release-artifacts
      - name: Verify checksums and publish one new Release
        shell: python {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          import hashlib, os, subprocess
          from pathlib import Path
          root = Path('release-artifacts'); tag = os.environ['RELEASE_TAG']
          names = {f'GaiaGIS-{tag}-{target}.zip' for target in ('windows-x64',)}
          records = [line.split() for line in (root / 'SHA256SUMS.txt').read_text(encoding='ascii').splitlines()]
          if len(records) != 1 or any(len(row) != 2 for row in records) or {row[1] for row in records} != names:
              raise RuntimeError('Unexpected checksum manifest')
          for digest, name in records:
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != digest:
                  raise RuntimeError('Checksum mismatch')
          existing = subprocess.run(['gh', 'release', 'view', tag], capture_output=True)
          if existing.returncode == 0:
              raise RuntimeError('Existing Release will not be overwritten')
          command = ['gh', 'release', 'create', tag, *[str(root / name) for name in sorted(names)],
                     str(root / 'SHA256SUMS.txt'), '--verify-tag', '--title', 'GaiaGIS ' + tag]
          notes = Path('docs/releases') / f'{tag}.md'
          if not notes.is_file():
              raise RuntimeError(f'Required curated release notes are missing: {notes}')
          command += ['--notes-file', str(notes)]
          subprocess.run(command, check=True)
