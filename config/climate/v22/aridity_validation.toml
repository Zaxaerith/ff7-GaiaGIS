# Declared before V22 Penman-Monteith correlation; never tuned to family scores.
primary_metric = "raw_P_over_PM_ET0_valid_land_domain"
primary_minimum_areaweighted_correlation = 0.35
secondary_metrics = ["P_minus_PET", "P_over_P_plus_PET", "all_land_raw_P_over_PET"]
secondary_metrics_affect_gate = false
minimum_annual_reference_pet_mm = 100.0
minimum_reference_annual_temperature_c = 0.0
minimum_reference_warmest_month_c = 10.0
minimum_reference_thawed_months = 3
maximum_reference_snow_fraction = 0.5
minimum_land_fraction = 0.5
monthly_frozen_temperature_c = 0.0
frozen_month_reference_crop_et = "excluded from annual active_crop_ET0; store unmasked PM diagnostic separately"
snow_reference = "NCEP SWE >=10 mm, 1981-2010; supporting diagnostic, previously seen"
reference_formula = "FAO56 Eq6, monthly mean meteorology; daily rate times mean Gregorian month length"
soil_heat_flux_assumption = "G=0 for climatological reference; monthly transient heat storage not resolved"
negative_et_policy = "clip to zero; do not infer sublimation"
reference_surface_albedo = 0.23
wind_measurement_height_m = 10.0
wind_conversion = "u2=u10*4.87/log(67.8*10-5.42), FAO56 Eq47"
humidity_conversion = "ea=q*P/(0.622+0.378*q), q kg/kg, P kPa"
valid_domain_rationale = "FAO reference is an actively growing, well-watered grass surface. Cold/frozen permanent-snow regions are not a valid liquid-water crop aridity regime; minimum PET prevents singular ratios. Thresholds are explicit engineering domain rules, not universal FAO climate thresholds. Reference-only mask is shared by every family; model outcomes cannot select cells."
